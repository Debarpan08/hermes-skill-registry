<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Skill Registry</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #388bfd;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0; z-index: 100;
  }
  header h1 { font-size: 20px; color: var(--accent); }
  header h1 span { color: var(--text-dim); font-weight: 400; font-size: 14px; margin-left: 8px; }

  /* Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }

  /* Sidebar */
  .sidebar { position: sticky; top: 80px; align-self: start; }
  .sidebar section { margin-bottom: 24px; }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.5px; }

  /* Search */
  input[type="text"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-dim); }

  /* Trending */
  .trending-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 13px; cursor: pointer;
    color: var(--text-dim);
  }
  .trending-item:hover { color: var(--accent); }
  .trending-item .num { color: var(--text-dim); font-size: 11px; width: 20px; }

  /* Skill Cards */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-title a { color: var(--accent); text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .card-version {
    font-size: 11px; color: var(--text-dim);
    background: var(--bg); padding: 2px 6px;
    border-radius: 4px; border: 1px solid var(--border);
  }
  .card-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }
  .card-meta {
    display: flex; align-items: center; gap: 16px;
    font-size: 12px; color: var(--text-dim);
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    padding: 6px 14px; border-radius: var(--radius);
    font-size: 13px; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: #2ea043; border-color: #2ea043; color: #fff; }
  .btn svg { width: 14px; height: 14px; }

  /* Tags */
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 12px; background: rgba(88,166,255,0.1);
    color: var(--accent); border: 1px solid rgba(88,166,255,0.2);
    margin-right: 4px; margin-top: 8px;
  }

  /* Stars rating */
  .stars { color: var(--yellow); }
  .empty-stars { color: var(--border); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    justify-content: center; align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); width: 700px; max-height: 80vh;
    overflow-y: auto; padding: 24px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { color: var(--accent); font-size: 18px; }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }
  .modal pre {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    font-size: 12px; overflow-x: auto; white-space: pre-wrap;
    color: var(--text); line-height: 1.6;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface); border: 1px solid var(--green);
    border-radius: var(--radius); padding: 12px 20px;
    font-size: 14px; color: var(--green);
    z-index: 300; opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  /* Loading / Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty p { margin-top: 8px; }
  .results-count { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Hermes Skill Registry <span>npm for Hermes skills</span></h1>
  <a href="/docs" target="_blank" class="btn" style="font-size:12px;">API Docs</a>
</header>

<div class="container">
  <div class="grid">
    <!-- Sidebar -->
    <aside class="sidebar">
      <section>
        <h3>Search</h3>
        <input type="text" id="searchInput" placeholder="Search skills..." oninput="debounceSearch()">
      </section>
      <section>
        <h3>Category</h3>
        <select id="categoryFilter" onchange="doSearch()">
          <option value="">All categories</option>
          <option value="software-development">software-development</option>
          <option value="github">github</option>
          <option value="research">research</option>
          <option value="email">email</option>
          <option value="data-science">data-science</option>
          <option value="devops">devops</option>
          <option value="mlops">mlops</option>
          <option value="creative">creative</option>
          <option value="productivity">productivity</option>
        </select>
      </section>
      <section>
        <h3>Sort</h3>
        <select id="sortFilter" onchange="doSearch()">
          <option value="score">Score (default)</option>
          <option value="newest">Newest</option>
          <option value="popular">Most downloaded</option>
          <option value="rating">Highest rated</option>
        </select>
      </section>
      <section>
        <h3>🔥 Trending</h3>
        <div id="trendingList"><p style="color:var(--text-dim);font-size:13px;">Loading…</p></section>
      </section>
      <section>
        <h3>How to use</h3>
        <p style="font-size:12px;color:var(--text-dim);line-height:1.6;">
          1. Search or browse skills<br>
          2. Click <strong>Install</strong> to get the CLI command<br>
          3. Run it in your terminal<br>
          4. Rate skills after using them
        </p>
      </section>
    </aside>

    <!-- Main -->
    <main>
      <div class="results-count" id="resultsCount"></div>
      <div class="cards" id="cards">
        <div class="empty"><p>Loading skills…</p></div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modalTitle">Skill</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const BASE = '';

// Debounce search
let searchTimer;
function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 300); }

// Fetch wrapper
async function fetchJSON(path) {
  const r = await fetch(`${BASE}${path}`);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

// Star display
function starHTML(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5;
  let h = '';
  for (let i = 0; i < 5; i++) {
    if (i < full) h += '<span class="stars">★</span>';
    else if (i === full && half) h += '<span class="stars">★</span>';
    else h += '<span class="empty-stars">★</span>';
  }
  return h;
}

// Render skill card
function cardHTML(s) {
  const tags = s.tags ? s.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
  const rating = s.avg_rating || 0;
  return `
  <div class="card">
    <div class="card-header">
      <div class="card-title"><a href="#" onclick="viewSkill(${s.id}); return false;">${s.name}</a></div>
      <span class="card-version">v${s.version || '1.0.0'}</span>
    </div>
    <div class="card-desc">${s.description}</div>
    <div class="card-meta">
      <span>👤 ${s.author}</span>
      <span>📥 ${s.downloads || 0}</span>
      <span>⭐ ${s.stars || 0}</span>
      <span>${starHTML(rating)} ${rating ? rating.toFixed(1) : '—'}</span>
      <span>📁 ${s.category}</span>
    </div>
    ${tags ? `<div>${tags}</div>` : ''}
    <div class="card-actions">
      <button class="btn btn-primary" onclick="copyInstall(${s.id}, '${s.name}')">📋 Install</button>
      <button class="btn" onclick="viewSkill(${s.id})">👁 View</button>
    </div>
  </div>`;
}

// Copy install command
function copyInstall(id, name) {
  const cmd = `hermes-registry install ${id}`;
  navigator.clipboard.writeText(cmd).then(() => {
    showToast(`Copied: ${cmd}`);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = cmd;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(`Copied: ${cmd}`);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// View skill in modal
async function viewSkill(id) {
  try {
    const s = await fetchJSON(`/api/v1/skills/${id}`);
    document.getElementById('modalTitle').textContent = `${s.name} v${s.version}`;
    document.getElementById('modalBody').innerHTML = `
      <p style="color:var(--text-dim);margin-bottom:8px;">${s.description}</p>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">
        <strong>Author:</strong> ${s.author} &nbsp;|&nbsp;
        <strong>Category:</strong> ${s.category} &nbsp;|&nbsp;
        <strong>Downloads:</strong> ${s.downloads} &nbsp;|&nbsp;
        <strong>Stars:</strong> ${s.stars} &nbsp;|&nbsp;
        <strong>Rating:</strong> ${s.avg_rating ? s.avg_rating.toFixed(1) : '—'}
      </div>
      <button class="btn btn-primary" onclick="copyInstall(${s.id}, '${s.name}')" style="margin-bottom:16px;">📋 Copy Install Command</button>
      <hr style="border-color:var(--border);margin:16px 0;">
      <h3 style="margin-bottom:8px;font-size:14px;">SKILL.md Preview</h3>
      <pre>${escapeHtml(s.skill_md.substring(0, 3000))}${s.skill_md.length > 3000 ? '\n\n…(truncated)' : ''}</pre>
    `;
    document.getElementById('modal').classList.add('active');
  } catch (e) {
    showToast(`Error: ${e.message}`);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function closeModal(e) {
  document.getElementById('modal').classList.remove('active');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// Search
async function doSearch() {
  const q = document.getElementById('searchInput').value;
  const cat = document.getElementById('categoryFilter').value;
  const sort = document.getElementById('sortFilter').value;
  const params = new URLSearchParams({ q, category: cat, sort, page_size: '50' });
  try {
    const data = await fetchJSON(`/api/v1/search?${params}`);
    document.getElementById('resultsCount').textContent = `${data.total} skill${data.total !== 1 ? 's' : ''} found`;
    const cards = document.getElementById('cards');
    if (!data.skills.length) {
      cards.innerHTML = '<div class="empty"><p>No skills found</p><p>Try a different search term</p></div>';
    } else {
      cards.innerHTML = data.skills.map(cardHTML).join('');
    }
  } catch (e) {
    document.getElementById('cards').innerHTML = `<div class="empty"><p>Error loading skills</p><p style="font-size:12px;">${e.message}</p></div>`;
  }
}

// Trending
async function loadTrending() {
  try {
    const data = await fetchJSON('/api/v1/trending?limit=5');
    const el = document.getElementById('trendingList');
    if (!data.skills.length) {
      el.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No trending skills yet</p>';
    } else {
      el.innerHTML = data.skills.map((s, i) =>
        `<div class="trending-item" onclick="viewSkill(${s.id})">
           <span class="num">${i + 1}.</span>
           <span>${s.name}</span>
           <span style="margin-left:auto;">📥 ${s.downloads}</span>
         </div>`
      ).join('');
    }
  } catch (e) {
    document.getElementById('trendingList').innerHTML = '<p style="color:var(--text-dim);font-size:13px;">Load failed</p>';
  }
}

// Init
doSearch();
loadTrending();
</script>
</body>
</html>
